    body {

      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 20px;
      color: #e3e3e8;
    }
    .card {
      max-width: 680px;
      width: 100%;
      background: #14141c;
      border-radius: 36px;
      padding: 30px 28px 40px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.7), 0 0 0 1px #2a2a36 inset;
    }
    .notice {
      background: #1e1e2a;
      border-left: 4px solid #b7a0ff;
      padding: 18px 20px;
      border-radius: 20px;
      margin-bottom: 28px;
      font-size: 0.9rem;
      line-height: 1.6;
      color: #cbcbd6;
    }
    .notice strong { color: #e0d6ff; }
    .notice ul { list-style: none; margin-top:8px; padding-left:4px; }
    .notice ul li { padding:4px 0; display:flex; align-items:baseline; gap:6px; }
    .notice ul li::before { content:"•"; color:#8f7fd6; font-weight:bold; font-size:1.2rem; }
    .supplement {
      margin-top:12px; padding-top:12px;
      border-top:1px dashed #2f2f3e;
      font-size:0.85rem; color:#a8a8b8; font-style:italic;
    }
    .header {
      display:flex; justify-content:space-between; align-items:baseline;
      margin-bottom:24px; flex-wrap:wrap; gap:6px 12px;
    }
    .header h2 {
      font-weight:500; font-size:1.5rem;
      background:linear-gradient(135deg,#d4caff,#b3a0f0);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      background-clip:text;
    }
    .header .badge {
      font-size:0.75rem; background:#282838; padding:6px 14px;
      border-radius:40px; color:#bdbdd0; border:1px solid #3b3b4e;
      white-space:nowrap;
    }
    .entry-grid { display:flex; flex-direction:column; gap:4px; }
    .entry-wrapper { margin-bottom:0; }
    .entry-item {
      background:#1c1c28; border-radius:28px; padding:18px 22px;
      border:1px solid #2c2c3e; cursor:pointer;
      box-shadow:0 4px 8px rgba(0,0,0,0.2);
      display:flex; justify-content:space-between; align-items:center;
      transition:all 0.2s ease;
      user-select:none; -webkit-tap-highlight-color:transparent;
    }
    .entry-item:hover { background:#242433; border-color:#4f4a70; transform:scale(1.01); }
    .entry-item:active { transform:scale(0.98); }
    .entry-item.expanded {
      border-color:#6b5d9e; border-radius:28px 28px 0 0;
      box-shadow:0 8px 16px rgba(0,0,0,0.5);
    }
    .entry-left { display:flex; flex-direction:column; gap:2px; flex:1; }
    .entry-title { font-size:1.4rem; font-weight:500; color:#f2edff; }
    .entry-sub { font-size:0.85rem; color:#9f9fb2; font-style:italic; opacity:0.8; }
    .entry-arrow {
      font-size:1.8rem; color:#8878c0; transition:transform 0.2s;
      line-height:1; flex-shrink:0; margin-left:12px;
    }
    .entry-item:hover .entry-arrow { transform:translateX(6px); color:#b8a6ff; }
    .entry-item.expanded .entry-arrow { transform:rotate(90deg); color:#b8a6ff; }
    .directory-panel {
      background:#13131e; border-radius:0 0 28px 28px;
      padding:18px 20px 20px; border:1px solid #33334a; border-top:none;
      box-shadow:0 8px 0 #0a0a10, 0 12px 28px rgba(0,0,0,0.6);
      display:none; animation:fadeSlide 0.25s ease forwards;
      margin-bottom:16px;
    }
    .directory-panel.active { display:block; }
    @keyframes fadeSlide {
      0% { opacity:0; transform:translateY(-6px); }
      100% { opacity:1; transform:translateY(0); }
    }
    .directory-header {
      display:flex; justify-content:space-between; align-items:center;
      border-bottom:1px solid #2b2b40; padding-bottom:10px; margin-bottom:14px;
    }
    .directory-header span { font-size:0.9rem; color:#b9b2d6; }
    .close-dir {
      background:none; border:none; color:#7a6f9e;
      font-size:1.3rem; cursor:pointer; padding:0 6px;
      transition:0.15s;
    }
    .close-dir:hover { color:#d6caff; transform:rotate(90deg); }
    .dir-list { display:flex; flex-direction:column; gap:8px; }
    .dir-item {
      background:#1d1d2b; padding:12px 18px; border-radius:40px;
      display:flex; align-items:center; justify-content:space-between;
      border:1px solid #2e2e44; cursor:pointer;
      color:#d6d0ec; font-size:1rem; transition:0.15s;
    }

    .dir-item .dir-index {

      padding:2px 12px; border-radius:30px; border:1px solid #3e3e5a;
      flex-shrink:0; margin-left:12px;
    }
    .footnote {
      margin-top:20px; font-size:0.7rem; text-align:center;
      color:#55556a; border-top:1px solid #222235; padding-top:18px;
    }
    @media (max-width:480px) {
      .card { padding:22px 16px 30px; }

      .directory-panel { padding:14px 14px 16px; }

/* ===== NEW 标记 ===== */
.entry-item {
  position: relative;   /* 让 NEW 能绝对定位到卡片右上角 */

.entry-new-badge {

      return roleKey + '::' + href;
    }

    // ============================================================
    //  自动检测 NEW：对比上次存的文章列表
    // ============================================================
    var LS_SNAPSHOT = 'jellyfish_snapshot';

    function detectNewArticles() {
      var oldSnapshot = {};
      try {
        oldSnapshot = JSON.parse(localStorage.getItem(LS_SNAPSHOT) || '{}');
      } catch(e) { oldSnapshot = {}; }

      var newSnapshot = {};

      Object.keys(articlesData).forEach(function(roleKey) {
        var role = articlesData[roleKey];
        var currentHrefs = role.list.map(function(a) { return a.href; });
        newSnapshot[roleKey] = currentHrefs;

        // 第一次访问，不标记 NEW
        if (!oldSnapshot[roleKey]) return;

        var oldHrefs = oldSnapshot[roleKey];
        var newSet = getNewSet(roleKey);
        currentHrefs.forEach(function(href) {
          if (oldHrefs.indexOf(href) === -1) {
            newSet.add(href);
          }
        });
        saveNewSet(roleKey, newSet);
      });

      localStorage.setItem(LS_SNAPSHOT, JSON.stringify(newSnapshot));
    }

    detectNewArticles();

    // ============================================================
    //  渲染卡片
    // ============================================================
    var grid = document.getElementById('entryGrid');
    if (!grid) return;
    grid.innerHTML = '';

    Object.keys(articlesData).forEach(function(roleKey) {
      var role = articlesData[roleKey];
      if (!role) return;

      var newSet = getNewSet(roleKey);
      var hasNew = role.list.some(function(a) { return newSet.has(a.href); });

      var wrapper = document.createElement('div');
      wrapper.className = 'entry-wrapper';

      var item = document.createElement('div');
      item.className = 'entry-item';
      item.dataset.target = roleKey;

      var badgeHTML = hasNew ? '<div class="entry-new-badge">NEW</div>' : '';

      item.innerHTML =
        badgeHTML +
        '<div class="entry-left">' +
          '<div class="entry-title">' + role.name + '</div>' +
          '<div class="entry-sub">' + (role.subtitle || '') + '</div>' +
        '</div>' +
        '<div class="entry-arrow">↗</div>';

      var panel = document.createElement('div');
      panel.className = 'directory-panel';
      panel.id = roleKey + 'Dir';
      panel.innerHTML =
        '<div class="directory-header">' +
          '<span>' + role.name + ' · 文章目录</span>' +
          '<button class="close-dir" data-close="' + roleKey + '">✕</button>' +
        '</div>' +
        '<div class="dir-list" id="' + roleKey + 'DirList"></div>';

      wrapper.appendChild(item);
      wrapper.appendChild(panel);
      grid.appendChild(wrapper);
    });

    // ============================================================
    //  收集面板
    // ============================================================
    var dirPanels = {};
    var dirLists = {};
    Object.keys(articlesData).forEach(function(roleKey) {
      var panel = document.getElementById(roleKey + 'Dir');
      var list = document.getElementById(roleKey + 'DirList');
      if (panel) dirPanels[roleKey] = panel;
      if (list) dirLists[roleKey] = list;
    });

    function hideAllDirs() {
      Object.keys(articlesData).forEach(function(roleKey) {
        if (dirPanels[roleKey]) dirPanels[roleKey].classList.remove('active');
        var entry = document.querySelector('.entry-item[data-target="' + roleKey + '"]');
        if (entry) entry.classList.remove('expanded');
      });
    }

    // ============================================================
    //  渲染目录列表（含 NEW / 已读）
    // ============================================================
    function renderDirList(roleKey) {
      var role = articlesData[roleKey];
      if (!role) return;
      var container = dirLists[roleKey];
      if (!container) return;

      var newSet = getNewSet(roleKey);
      var readSet = getReadSet();

      container.innerHTML = '';
      role.list.forEach(function(article, index) {
        var isNew = newSet.has(article.href);
        var isRead = readSet.has(articleKey(roleKey, article.href));

        var div = document.createElement('div');
        div.className = 'dir-item' + (isRead ? ' read' : '');

        var readMark = isRead ? '<span class="dir-read-mark">✓</span>' : '';
        var newBadge = isNew ? '<span class="dir-new-badge">NEW</span>' : '';

        div.innerHTML =
          '<span>' + readMark + article.title + newBadge + '</span>' +
          '<span class="dir-index">#' + (index + 1) + '</span>';

        div.addEventListener('click', function(e) {
          e.stopPropagation();

          // 标记为已读
          var rs = getReadSet();
          rs.add(articleKey(roleKey, article.href));
          saveReadSet(rs);

          // 清除该篇的 NEW
          var ns = getNewSet(roleKey);
          ns.delete(article.href);
          saveNewSet(roleKey, ns);

          // 更新卡片上的 NEW 标记
          updateCardNewBadge(roleKey);

          // 重新渲染当前列表（更新已读状态）
          renderDirList(roleKey);

          // 跳转
          if (article.href) {
            window.location.href = article.href;
          }
        });

        container.appendChild(div);
      });
    }

    // ============================================================
    //  更新卡片上的 NEW 标记
    // ============================================================
    function updateCardNewBadge(roleKey) {
      var role = articlesData[roleKey];
      if (!role) return;
      var newSet = getNewSet(roleKey);
      var hasNew = role.list.some(function(a) { return newSet.has(a.href); });

      var item = document.querySelector('.entry-item[data-target="' + roleKey + '"]');
      if (!item) return;

      var existingBadge = item.querySelector('.entry-new-badge');
      if (hasNew && !existingBadge) {
        var badge = document.createElement('div');
        badge.className = 'entry-new-badge';
        badge.textContent = 'NEW';
        item.insertBefore(badge, item.firstChild);
      } else if (!hasNew && existingBadge) {
        existingBadge.remove();
      }
    }

    // ============================================================
    //  展开 / 收起目录 + 平滑滚动
    // ============================================================
    function toggleDirectory(roleKey) {
      var panel = dirPanels[roleKey];
      if (!panel) return;

      if (panel.classList.contains('active')) {
        panel.classList.remove('active');
        var entry = document.querySelector('.entry-item[data-target="' + roleKey + '"]');
        if (entry) entry.classList.remove('expanded');
        return;
      }

      hideAllDirs();
      panel.classList.add('active');
      var entry = document.querySelector('.entry-item[data-target="' + roleKey + '"]');
      if (entry) entry.classList.add('expanded');
      renderDirList(roleKey);

      // 平滑滚动到面板可见
      setTimeout(function() {
        panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }, 100);
    }

    // ============================================================
    //  事件绑定
    // ============================================================
    document.querySelectorAll('.entry-item').forEach(function(item) {
      item.addEventListener('click', function(e) {
        var target = this.dataset.target;
        if (target && articlesData[target]) toggleDirectory(target);
      });
    });

    document.querySelectorAll('.close-dir').forEach(function(btn) {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        var role = this.dataset.close;
        if (role && dirPanels[role]) {
          dirPanels[role].classList.remove('active');
          var entry = document.querySelector('.entry-item[data-target="' + role + '"]');
          if (entry) entry.classList.remove('expanded');
        }
      });
    });

    document.addEventListener('click', function(e) {
      if (!e.target.closest('.card')) hideAllDirs();
    });

    // ============================================================
    //  深浅色切换
    // ============================================================
    var themeToggle = document.getElementById('themeToggle');
    var savedTheme = localStorage.getItem(LS_THEME);

    function applyTheme(theme) {
      if (theme === 'light') {
        document.body.classList.add('light-mode');
        themeToggle.textContent = '☀️';
      } else {
        document.body.classList.remove('light-mode');
        themeToggle.textContent = '🌙';
      }
    }

    if (savedTheme) {
      applyTheme(savedTheme);
    }

    themeToggle.addEventListener('click', function() {
      var isLight = document.body.classList.contains('light-mode');
      var newTheme = isLight ? 'dark' : 'light';
      applyTheme(newTheme);
      localStorage.setItem(LS_THEME, newTheme);
    });

    console.log('🌊 已加载，共 ' + Object.keys(articlesData).length + ' 个角色');
  })();
</script>
</body>
</html>
